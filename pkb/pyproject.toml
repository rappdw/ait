[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pkb"
version = "0.1.0"
description = "Personal Knowledge Base — SQLite-backed knowledge base with FTS5 and optional semantic search."
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.0"]
pdf = ["pdfplumber>=0.9"]
docx = ["python-docx>=0.8"]
all = ["pkb[embeddings,pdf,docx]"]

[project.scripts]
pkb = "pkb.cli:main"
